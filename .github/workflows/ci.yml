name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Dummy values — CI never talks to a real database (db-push-if-vercel.js
      # only runs when VERCEL is set), but Prisma reads these at schema-parse
      # time even for `generate`, so they must exist and be well-formed.
      DATABASE_URL: 'postgresql://user:password@localhost:5432/ejo100'
      DIRECT_URL: 'postgresql://user:password@localhost:5432/ejo100'
      BETTER_AUTH_SECRET: 'ci-placeholder-secret-do-not-use-in-production'
      BETTER_AUTH_URL: 'http://localhost:3001'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm install
      # @ejo/database no longer builds itself from its own postinstall (that
      # caused a race condition — see packages/database/package.json history).
      # Every other workspace's typecheck/build/lint depends on its compiled
      # dist/index.d.ts existing, so it must be built explicitly here, before
      # anything that consumes it runs — mirrors the same explicit step in
      # Render's Build Command for apps/api.
      - run: npm run build --workspace=packages/database
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
