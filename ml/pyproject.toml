[project]
name = "ejo-ml"
version = "0.1.0"
description = "Enyo machine learning for EJO 100: trains each organisation's own models and hands the portal portable artifacts."
requires-python = ">=3.11"
dependencies = ["numpy==2.3.3", "pandas==2.3.2", "scipy==1.16.2", "scikit-learn==1.7.2", "lightgbm==4.6.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
